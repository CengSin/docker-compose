# PostgreSQL 配置文件
# 此文件已挂载到容器，修改后需要重启容器生效

# 连接设置
listen_addresses = '*'
port = 5432
max_connections = 100

# 内存设置
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
work_mem = 16MB

# WAL 设置
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# 日志设置
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'all'
log_duration = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# 时区
timezone = 'Asia/Shanghai'

# 字符集
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
# 中文全文搜索配置（使用 zhparser）
default_text_search_config = 'chinese_zh'

# 性能优化
random_page_cost = 1.1
effective_io_concurrency = 200

# 扩展相关设置
# vector 和 pg_bm25 扩展已通过 shared_preload_libraries 加载
# zhparser 扩展在数据库初始化时自动创建